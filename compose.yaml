# Local PostgreSQL for development and integration tests. Not for production.
name: focus-forest-api

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: focus_forest
      POSTGRES_PASSWORD: focus_forest
      POSTGRES_DB: focus_forest
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U focus_forest -d focus_forest_test']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
